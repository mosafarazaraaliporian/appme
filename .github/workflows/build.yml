name: Build and Release

on:
  push:
    branches: [ main, master, reconstructed-from-decompile ]
  pull_request:
    branches: [ main, master, reconstructed-from-decompile ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build APKs
      run: |
        echo "🔨 Building APKs..."
        ./gradlew assembleDebug assembleRelease --parallel --build-cache -x lint -x test
      env:
        GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
    
    - name: Sign Release APK
      run: |
        echo "🔑 Signing Release APK..."
        
        # Setup keystore
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          KEYSTORE_FILE="keystore.jks"
          KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
        else
          # Use debug keystore
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          KEYSTORE_FILE="$HOME/.android/debug.keystore"
          KEYSTORE_PASSWORD="android"
          KEY_ALIAS="androiddebugkey"
          KEY_PASSWORD="android"
        fi
        
        # Sign Release APK
        for apk in app/build/outputs/apk/release/*-unsigned.apk app/build/outputs/apk/release/*-release.apk; do
          if [ -f "$apk" ]; then
            echo "📱 Signing: $(basename $apk)"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$apk" "$KEY_ALIAS"
            echo "✅ Signed: $(basename $apk)"
          fi
        done
        
        # Cleanup
        [ -f keystore.jks ] && rm -f keystore.jks
    
    - name: Show APK Sizes
      run: |
        echo "📊 APK Sizes:"
        echo "Debug:"
        ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null | awk '{print "  " $9 " - " $5}'
        echo "Release:"
        ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null | awk '{print "  " $9 " - " $5}'
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-files
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Send to Telegram
      if: success()
      run: |
        BOT_TOKEN="8312138474:AAHSLslHtfLEwRM-oKae-YOuxpMEKKJo5Hs"
        CHAT_ID="7053561971"
        
        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
        
        # Success message
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" \
          -d text="✅ Build Success!%0A🔨 ${COMMIT_SHA}: ${COMMIT_MSG}" \
          -d parse_mode="Markdown"
        
        # Send APKs
        for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
          if [ -f "$apk" ]; then
            SIZE=$(du -h "$apk" | cut -f1)
            TYPE=$(echo "$apk" | grep -q "debug" && echo "Debug" || echo "Release")
            
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"$apk" \
              -F caption="📦 ${TYPE} APK (${SIZE})"
          fi
        done
    
    - name: Notify Failure
      if: failure()
      run: |
        BOT_TOKEN="8312138474:AAHSLslHtfLEwRM-oKae-YOuxpMEKKJo5Hs"
        CHAT_ID="7053561971"
        COMMIT_SHA=$(git rev-parse --short HEAD)
        
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" \
          -d text="❌ Build Failed!%0A🔨 ${COMMIT_SHA}%0A🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          -d parse_mode="Markdown"
