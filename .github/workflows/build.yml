name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK (fast)
      run: ./gradlew assembleDebug --parallel --max-workers=4 -x test -x lint --build-cache
      env:
        GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
      
    - name: Build Release APK (optimized)
      run: ./gradlew assembleRelease --parallel --max-workers=4 -x test -x lint --build-cache
      env:
        GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
      
    - name: List APK files
      run: |
        echo "Debug APKs:"
        find app/build/outputs/apk/debug -name "*.apk" -type f || echo "No debug APKs found"
        echo "Release APKs:"
        find app/build/outputs/apk/release -name "*.apk" -type f || echo "No release APKs found"
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: warn
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn
        
    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          app/build/outputs/
          .gradle/
        retention-days: 7
