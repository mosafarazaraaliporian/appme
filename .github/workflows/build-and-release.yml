name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Release APK
      run: ./gradlew assembleRelease
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build AAB (Android App Bundle - recommended for smaller size)
      run: ./gradlew bundleRelease
      continue-on-error: true
    
    - name: Optimize APK with zipalign (if Android SDK available)
      run: |
        if [ -d "$ANDROID_HOME/build-tools" ]; then
          echo "Optimizing Release APK with zipalign..."
          zipalign_cmd=$(find $ANDROID_HOME/build-tools -name zipalign | head -1)
          if [ -n "$zipalign_cmd" ]; then
            for apk in app/build/outputs/apk/release/*.apk; do
              if [ -f "$apk" ] && [[ ! "$apk" == *"-signed"* ]] && [[ ! "$apk" == *"-aligned"* ]]; then
                original_size=$(stat -f%z "$apk" 2>/dev/null || stat -c%s "$apk" 2>/dev/null || echo "0")
                aligned="${apk%.apk}-aligned.apk"
                $zipalign_cmd -P 16 -f -v 4 "$apk" "$aligned" && mv "$aligned" "$apk" && echo "Optimized: $apk (Original: ${original_size} bytes)" || echo "zipalign failed for $apk"
              fi
            done
          fi
        else
          echo "Android SDK not found, skipping zipalign (Gradle already does this automatically)"
        fi
    
    - name: Show APK size
      run: |
        echo "=== Release APK Size ==="
        ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No release APKs"
      
    - name: List Release APK files
      run: |
        echo "Release APKs:"
        find app/build/outputs/apk/release -name "*.apk" -type f || echo "No release APKs found"
      
    - name: Sign APK (if keystore exists)
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
        for apk in app/build/outputs/apk/release/*.apk; do
          if [[ ! "$apk" == *"-signed"* ]] && [[ ! "$apk" == *"-aligned"* ]]; then
            echo "Signing: $apk"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore keystore.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEY_PASSWORD }}" \
              "$apk" \
              "${{ secrets.KEY_ALIAS }}"
            
            # Verify signature
            jarsigner -verify -verbose -certs "$apk" || echo "Warning: Signature verification failed"
          fi
        done
      continue-on-error: true
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90
        if-no-files-found: warn
    
    - name: Upload Release AAB (if available)
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 90
        if-no-files-found: ignore
      
    - name: Create GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
